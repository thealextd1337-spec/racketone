<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171917" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Advantly Support</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <main id="app">
      <noscript>Advantly Support requires JavaScript to access the private inbox.</noscript>
    </main>
    <dialog class="confirm-dialog" id="public-confirm" aria-labelledby="public-confirm-title">
      <form method="dialog" class="confirm-dialog__surface">
        <div class="confirm-dialog__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false"><path d="M12 3.5 21 20H3L12 3.5Z" /><path d="M12 9v4.5M12 17h.01" /></svg>
        </div>
        <h2 id="public-confirm-title"></h2>
        <p id="public-confirm-copy"></p>
        <p class="confirm-dialog__preview" id="public-confirm-preview"></p>
        <div class="confirm-dialog__actions">
          <button class="button button--quiet" value="cancel" data-action="cancel-public-send" id="public-cancel"></button>
          <button class="button button--accent" value="confirm" data-action="confirm-public-send" id="public-accept"></button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
