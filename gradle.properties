# Gradle
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g
# Apple-Targets sind auf Windows/Linux nicht baubar und werden still übersprungen
kotlin.native.ignoreDisabledTargets=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# App-Version (Phone + Wear teilen sich die Version; versionCode Wear = Phone-Code, Play unterscheidet per Formfaktor-Track)
advantly.versionName=0.1.0
advantly.versionCode=1
