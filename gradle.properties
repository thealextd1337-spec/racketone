# Gradle
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g
# Apple-Targets sind auf Windows/Linux nicht baubar und werden still übersprungen
kotlin.native.ignoreDisabledTargets=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# App-Version – EINZIGE Quelle für Android (Phone + Wear) und Apple (iOS + watchOS)
# versionName: SemVer x.y.z (Apple: CFBundleShortVersionString / MARKETING_VERSION)
# buildNumber: fortlaufend, bei jedem Store-Upload erhöhen (Apple: CFBundleVersion / CURRENT_PROJECT_VERSION)
# Android-versionCode = buildNumber * 10 + Formfaktor (Phone 1, Wear 2) – Play verlangt eindeutige
# versionCodes über alle Formfaktoren; applicationId und Signierschlüssel bleiben identisch.
advantly.versionName=0.3.0
advantly.buildNumber=5
