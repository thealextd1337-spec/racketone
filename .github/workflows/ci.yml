name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Änderungen erkennen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            apple:
              - 'shared/**'
              - 'iosApp/**'
              - 'watchApp/**'
              - 'build-logic/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'

  gradle-check:
    name: Gradle check + Android/Wear-APKs (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # check = JVM-/Android-Host-Tests aller shared-Module, App-Unit-Tests, ktlintCheck, Android Lint
      - name: check + assembleDebug
        run: ./gradlew check :androidApp:assembleDebug :wearApp:assembleDebug --continue
      - name: Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-ubuntu
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: APKs hochladen
        uses: actions/upload-artifact@v7
        with:
          name: apks-debug
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            wearApp/build/outputs/apk/debug/*.apk
          retention-days: 7

  apple:
    name: Kotlin/Native-Tests + iOS/watchOS-Simulator-Builds (macOS)
    needs: changes
    if: needs.changes.outputs.apple == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Kotlin/Native-Toolchain cachen
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Xcode-Version
        run: xcodebuild -version
      - name: Simulatoren wählen
        id: sim
        run: python3 .github/scripts/pick_simulators.py >> "$GITHUB_OUTPUT"
      # Tests in eigenen Steps VOR dem XCFramework-Build, damit ihr Ergebnis separat sichtbar ist
      - name: Kotlin/Native-Tests iOS-Simulator (iosSimulatorArm64Test)
        env:
          IOS_SIM: ${{ steps.sim.outputs.ios }}
        run: ./gradlew iosSimulatorArm64Test --continue -Padvantly.simulator.ios="$IOS_SIM"
      - name: Kotlin/Native-Tests watchOS-Simulator (watchosSimulatorArm64Test)
        # läuft auch, wenn die iOS-Tests rot sind – beide Ergebnisse sollen sichtbar sein
        if: ${{ !cancelled() && steps.sim.outcome == 'success' }}
        env:
          WATCHOS_SIM: ${{ steps.sim.outputs.watchos }}
        run: ./gradlew watchosSimulatorArm64Test --continue -Padvantly.simulator.watchos="$WATCHOS_SIM"
      # Spike S1: EventStore (data) + WatchStore-Facade (umbrella-watch) laufen hier mit dem SQLDelight-native-driver
      - name: Testergebnisse ins Summary (watchOS/iOS)
        if: ${{ !cancelled() }}
        run: |
          python3 .github/scripts/watch_metrics.py tests watchosSimulatorArm64Test
          python3 .github/scripts/watch_metrics.py tests iosSimulatorArm64Test
      - name: XCFrameworks + Version.xcconfig erzeugen
        run: >-
          ./gradlew
          generateAppleVersionConfig
          :shared:umbrella-ios:assembleAdvantlyKitDebugXCFramework
          :shared:umbrella-watch:assembleAdvantlyWatchKitDebugXCFramework
          :shared:umbrella-watch:assembleAdvantlyWatchKitReleaseXCFramework
      # Spike S1: Größe je Slice/Architektur (Budget < 8 MB, 01 §2.3) → Job-Summary
      - name: Framework-Größen (Summary)
        run: >-
          python3 .github/scripts/watch_metrics.py frameworks
          shared/umbrella-watch/build/XCFrameworks/debug/AdvantlyWatchKit.xcframework
          shared/umbrella-watch/build/XCFrameworks/release/AdvantlyWatchKit.xcframework
          shared/umbrella-ios/build/XCFrameworks/debug/AdvantlyKit.xcframework
      - name: Compose-Resources im XCFramework prüfen
        run: find shared/umbrella-ios/build/XCFrameworks/debug -path '*composeResources*' -name '*.cvr' | tee /dev/stderr | grep -q .
      - name: XcodeGen installieren + Projekt erzeugen
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate
      - name: iOS-App bauen (Simulator, unsigniert)
        run: >-
          xcodebuild build
          -project iosApp/Advantly.xcodeproj
          -scheme Advantly
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
      - name: watchOS-App bauen (Simulator, unsigniert)
        run: >-
          xcodebuild build
          -project iosApp/Advantly.xcodeproj
          -scheme AdvantlyWatch
          -configuration Debug
          -destination 'generic/platform=watchOS Simulator'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
      # Spike S1: beweist, dass arm64_32 (watchosArm64) UND arm64 (watchosDeviceArm64, Tier 3) inkl. SQLite und
      # WatchConnectivity für echte Uhren linken – ohne Signatur, also ohne Apple-Account
      - name: watchOS-App für Gerät bauen (arm64_32 + arm64, unsigniert)
        run: >-
          xcodebuild build
          -project iosApp/Advantly.xcodeproj
          -scheme AdvantlyWatch
          -configuration Debug
          -destination 'generic/platform=watchOS'
          -derivedDataPath build/DerivedData
          ARCHS="arm64_32 arm64" ONLY_ACTIVE_ARCH=NO
          ENABLE_DEBUG_DYLIB=NO
          CODE_SIGNING_ALLOWED=NO
      # ENABLE_DEBUG_DYLIB=NO: sonst läge der App-Code in AdvantlyWatch.debug.dylib statt im Executable;
      # das Skript misst eine evtl. vorhandene *.debug.dylib trotzdem mit
      - name: Größe gelinkte Watch-App (Debug, Gerät)
        run: >-
          python3 .github/scripts/watch_metrics.py executable "AdvantlyWatch (Debug-Kotlin, Gerät)"
          build/DerivedData/Build/Products/Debug-watchos/AdvantlyWatch.app/AdvantlyWatch
      - name: App-Bundles prüfen (Compose-Resources, Lokalisierung)
        run: |
          products=build/DerivedData/Build/Products
          find "$products/Debug-iphonesimulator/Advantly.app/compose-resources" -name '*.cvr' | tee /dev/stderr | grep -q .
          test -f "$products/Debug-watchsimulator/AdvantlyWatch.app/de.lproj/Localizable.strings"
          test -f "$products/Debug-watchsimulator/AdvantlyWatch.app/en.lproj/Localizable.strings"
          test -f "$products/Debug-iphonesimulator/Advantly.app/de.lproj/Localizable.strings"
          test -f "$products/Debug-iphonesimulator/Advantly.app/en.lproj/Localizable.strings"
      # Spike S4: Live-Score (Compose Multiplatform) im iOS-Simulator starten, Auto-Benchmark (40 synthetische Punkte,
      # misst Zustand → Frame über die CADisplayLink-getriebene Frame-Clock) ablesen und Screenshots EN/DE ablegen.
      - name: iOS-Simulator – App starten, Benchmark + Screenshots (Spike S4)
        timeout-minutes: 15
        env:
          IOS_SIM: ${{ steps.sim.outputs.ios }}
        run: |
          set -euo pipefail
          app=build/DerivedData/Build/Products/Debug-iphonesimulator/Advantly.app
          out="$PWD/build/simulator"
          mkdir -p "$out"
          # macOS hat kein `timeout` – perl-alarm begrenzt das Warten auf den Boot
          xcrun simctl boot "$IOS_SIM" || true
          perl -e 'alarm shift; exec @ARGV' 300 xcrun simctl bootstatus "$IOS_SIM" -b
          xcrun simctl status_bar "$IOS_SIM" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$IOS_SIM" "$app"
          xcrun simctl launch --terminate-running-process --stdout="$out/app-en.log" --stderr="$out/app-en.err.log" "$IOS_SIM" eu.advantly -advantlyAutoBench -AppleLanguages "(en)" -AppleLocale en_US
          for _ in $(seq 1 90); do grep -q ADVANTLY_BENCH "$out/app-en.log" 2>/dev/null && break; sleep 1; done
          xcrun simctl io "$IOS_SIM" screenshot "$out/live-score-en.png"
          xcrun simctl launch --terminate-running-process --stdout="$out/app-de.log" --stderr="$out/app-de.err.log" "$IOS_SIM" eu.advantly -AppleLanguages "(de)" -AppleLocale de_DE
          sleep 10
          xcrun simctl io "$IOS_SIM" screenshot "$out/live-score-de.png"
          # Validiert n ≥ 40 und numerische Perzentile (sonst Fehler), bewertet G7 (Go/No-Go im Summary)
          python3 .github/scripts/check_s4_bench.py --self-test
          python3 .github/scripts/check_s4_bench.py "$out/app-en.log" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Simulator-Screenshots + Logs hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-s4
          path: build/simulator/
          if-no-files-found: warn
          retention-days: 14
      # Spike S1: Watch-App im Simulator starten; ContentView schreibt per WatchStore.smokeCheck() in die
      # SQLite-Datei und druckt ADVANTLY_SMOKE. Informativ (Simulator-Start kann flaky sein), Ergebnis im Summary.
      - name: watchOS-App-Smoke im Simulator (EventStore)
        continue-on-error: true
        env:
          WATCHOS_SIM: ${{ steps.sim.outputs.watchos }}
        run: |
          app=build/DerivedData/Build/Products/Debug-watchsimulator/AdvantlyWatch.app
          xcrun simctl boot "$WATCHOS_SIM" 2>/dev/null || true
          xcrun simctl bootstatus "$WATCHOS_SIM" -b
          xcrun simctl install "$WATCHOS_SIM" "$app"
          # -advantlySmoke: ContentView schreibt nur mit diesem Startparameter (und nur im Debug-Build) ins Store
          xcrun simctl launch --console-pty --terminate-running-process "$WATCHOS_SIM" eu.advantly.watchkitapp -advantlySmoke > smoke.log 2>&1 &
          pid=$!
          for _ in $(seq 1 45); do grep -q ADVANTLY_SMOKE smoke.log && break; sleep 2; done
          kill "$pid" 2>/dev/null || true
          xcrun simctl terminate "$WATCHOS_SIM" eu.advantly.watchkitapp 2>/dev/null || true
          tail -n 40 smoke.log
          python3 .github/scripts/watch_metrics.py smoke smoke.log
      # Spike S1: kaltstart-relevante Größe mit Release-Kotlin. project.yml verweist fest auf debug/ → das
      # Release-XCFramework für diese Messung dorthin kopieren (letzter Build-Schritt, informativ).
      - name: Größe gelinkte Watch-App (Release, Gerät)
        continue-on-error: true
        run: |
          xcf=shared/umbrella-watch/build/XCFrameworks
          rm -rf "$xcf/debug/AdvantlyWatchKit.xcframework"
          cp -R "$xcf/release/AdvantlyWatchKit.xcframework" "$xcf/debug/AdvantlyWatchKit.xcframework"
          xcodebuild build -project iosApp/Advantly.xcodeproj -scheme AdvantlyWatch -configuration Release -destination 'generic/platform=watchOS' -derivedDataPath build/DerivedData ARCHS="arm64_32 arm64" ONLY_ACTIVE_ARCH=NO ENABLE_DEBUG_DYLIB=NO CODE_SIGNING_ALLOWED=NO
          python3 .github/scripts/watch_metrics.py executable "AdvantlyWatch (Release-Kotlin, Gerät)" build/DerivedData/Build/Products/Release-watchos/AdvantlyWatch.app/AdvantlyWatch
      - name: Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-macos
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
