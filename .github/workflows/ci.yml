name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Änderungen erkennen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apple: ${{ steps.filter.outputs.apple }}
      supabase: ${{ steps.filter.outputs.supabase }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            apple:
              - 'shared/**'
              - 'iosApp/**'
              - 'watchApp/**'
              - 'build-logic/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            supabase:
              - 'supabase/**'
              - 'shared/**'
              - 'testvectors/**'
              - 'build-logic/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'gradlew*'
              - '.github/workflows/ci.yml'
              - '.github/scripts/export_stack_ci.py'
              - '.github/scripts/d1_stack_ci*.py'
              - 'tools/pilot-checks/**'
            admin:
              - 'admin/**'
              - '.github/workflows/ci.yml'

  admin:
    name: Admin Tests + Build
    needs: changes
    if: needs.changes.outputs.admin == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
        working-directory: admin
      - run: npm test
        working-directory: admin
      - run: npm run build
        working-directory: admin
      - run: npm run build:staging
        working-directory: admin
        env:
          VITE_SUPABASE_URL: https://lgeoafnbluvxoezpftzo.supabase.co
          # Ausschließlich Build-Fixture, kein gültiger Zugangsschlüssel.
          VITE_SUPABASE_ANON_KEY: sb_publishable_test_fixture

  gradle-check:
    name: Gradle check + Android/Wear-APKs (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # check = JVM-/Android-Host-Tests aller shared-Module, App-Unit-Tests, ktlintCheck, Android Lint
      - name: check + assembleDebug
        run: ./gradlew check :androidApp:assembleDebug :wearApp:assembleDebug --continue
      - name: Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-ubuntu
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: APKs hochladen
        uses: actions/upload-artifact@v7
        with:
          name: apks-debug
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            wearApp/build/outputs/apk/debug/*.apk
          retention-days: 7

  apple:
    name: Kotlin/Native-Tests + iOS/watchOS-Simulator-Builds (macOS)
    needs: changes
    if: needs.changes.outputs.apple == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Kotlin/Native-Toolchain cachen
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Xcode-Version
        run: xcodebuild -version
      # W1-E: Watch-App-Strings EN/DE paritätisch, alle in Swift verwendeten Schlüssel + Presets/Hinweis-Codes vorhanden
      - name: watchOS-Strings DE/EN prüfen (W1-E)
        run: python3 .github/scripts/check_watch_strings.py
      - name: Simulatoren wählen
        id: sim
        run: python3 .github/scripts/pick_simulators.py >> "$GITHUB_OUTPUT"
      # Tests in eigenen Steps VOR dem XCFramework-Build, damit ihr Ergebnis separat sichtbar ist
      - name: Kotlin/Native-Tests iOS-Simulator (iosSimulatorArm64Test)
        env:
          IOS_SIM: ${{ steps.sim.outputs.ios }}
        run: ./gradlew iosSimulatorArm64Test --continue -Padvantly.simulator.ios="$IOS_SIM"
      - name: Kotlin/Native-Tests watchOS-Simulator (watchosSimulatorArm64Test)
        # läuft auch, wenn die iOS-Tests rot sind – beide Ergebnisse sollen sichtbar sein
        if: ${{ !cancelled() && steps.sim.outcome == 'success' }}
        env:
          WATCHOS_SIM: ${{ steps.sim.outputs.watchos }}
        run: ./gradlew watchosSimulatorArm64Test --continue -Padvantly.simulator.watchos="$WATCHOS_SIM"
      # Spike S1: EventStore (data) + WatchStore-Facade (umbrella-watch) laufen hier mit dem SQLDelight-native-driver
      - name: Testergebnisse ins Summary (watchOS/iOS)
        if: ${{ !cancelled() }}
        run: |
          python3 .github/scripts/watch_metrics.py tests watchosSimulatorArm64Test
          python3 .github/scripts/watch_metrics.py tests iosSimulatorArm64Test
      - name: XCFrameworks + Version.xcconfig erzeugen
        run: >-
          ./gradlew
          generateAppleVersionConfig
          :shared:umbrella-ios:assembleAdvantlyKitDebugXCFramework
          :shared:umbrella-watch:assembleAdvantlyWatchKitDebugXCFramework
          :shared:umbrella-watch:assembleAdvantlyWatchKitReleaseXCFramework
      # Spike S1: Größe je Slice/Architektur (Budget < 8 MB, 01 §2.3) → Job-Summary
      - name: Framework-Größen (Summary)
        run: >-
          python3 .github/scripts/watch_metrics.py frameworks
          shared/umbrella-watch/build/XCFrameworks/debug/AdvantlyWatchKit.xcframework
          shared/umbrella-watch/build/XCFrameworks/release/AdvantlyWatchKit.xcframework
          shared/umbrella-ios/build/XCFrameworks/debug/AdvantlyKit.xcframework
      - name: Compose-Resources im XCFramework prüfen
        run: find shared/umbrella-ios/build/XCFrameworks/debug -path '*composeResources*' -name '*.cvr' | tee /dev/stderr | grep -q .
      - name: XcodeGen installieren + Projekt erzeugen
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate
      - name: iOS-App bauen (Simulator, unsigniert)
        run: >-
          xcodebuild build
          -project iosApp/Advantly.xcodeproj
          -scheme Advantly
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
      - name: watchOS-App bauen (Simulator, unsigniert)
        run: >-
          xcodebuild build
          -project iosApp/Advantly.xcodeproj
          -scheme AdvantlyWatch
          -configuration Debug
          -destination 'generic/platform=watchOS Simulator'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
      # Spike S1: beweist, dass arm64_32 (watchosArm64) UND arm64 (watchosDeviceArm64, Tier 3) inkl. SQLite und
      # WatchConnectivity für echte Uhren linken – ohne Signatur, also ohne Apple-Account
      - name: watchOS-App für Gerät bauen (arm64_32 + arm64, unsigniert)
        run: >-
          xcodebuild build
          -project iosApp/Advantly.xcodeproj
          -scheme AdvantlyWatch
          -configuration Debug
          -destination 'generic/platform=watchOS'
          -derivedDataPath build/DerivedData
          ARCHS="arm64_32 arm64" ONLY_ACTIVE_ARCH=NO
          ENABLE_DEBUG_DYLIB=NO
          CODE_SIGNING_ALLOWED=NO
      # ENABLE_DEBUG_DYLIB=NO: sonst läge der App-Code in AdvantlyWatch.debug.dylib statt im Executable;
      # das Skript misst eine evtl. vorhandene *.debug.dylib trotzdem mit
      - name: Größe gelinkte Watch-App (Debug, Gerät)
        run: >-
          python3 .github/scripts/watch_metrics.py executable "AdvantlyWatch (Debug-Kotlin, Gerät)"
          build/DerivedData/Build/Products/Debug-watchos/AdvantlyWatch.app/AdvantlyWatch
      - name: App-Bundles prüfen (Compose-Resources, Lokalisierung)
        run: |
          products=build/DerivedData/Build/Products
          find "$products/Debug-iphonesimulator/Advantly.app/compose-resources" -name '*.cvr' | tee /dev/stderr | grep -q .
          test -f "$products/Debug-watchsimulator/AdvantlyWatch.app/de.lproj/Localizable.strings"
          test -f "$products/Debug-watchsimulator/AdvantlyWatch.app/en.lproj/Localizable.strings"
          test -f "$products/Debug-iphonesimulator/Advantly.app/de.lproj/Localizable.strings"
          test -f "$products/Debug-iphonesimulator/Advantly.app/en.lproj/Localizable.strings"
      # Spike S4: Live-Score (Compose Multiplatform) im iOS-Simulator starten, Auto-Benchmark (40 synthetische Punkte,
      # misst Zustand → Frame über die CADisplayLink-getriebene Frame-Clock) ablesen und Screenshots EN/DE ablegen.
      - name: iOS-Simulator – App starten, Benchmark + Screenshots (Spike S4)
        timeout-minutes: 15
        env:
          IOS_SIM: ${{ steps.sim.outputs.ios }}
        run: |
          set -euo pipefail
          app=build/DerivedData/Build/Products/Debug-iphonesimulator/Advantly.app
          out="$PWD/build/simulator"
          mkdir -p "$out"
          # macOS hat kein `timeout` – perl-alarm begrenzt das Warten auf den Boot
          xcrun simctl boot "$IOS_SIM" || true
          perl -e 'alarm shift; exec @ARGV' 300 xcrun simctl bootstatus "$IOS_SIM" -b
          xcrun simctl status_bar "$IOS_SIM" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$IOS_SIM" "$app"
          xcrun simctl launch --terminate-running-process --stdout="$out/app-en.log" --stderr="$out/app-en.err.log" "$IOS_SIM" eu.advantly -advantlyAutoBench -AppleLanguages "(en)" -AppleLocale en_US
          for _ in $(seq 1 90); do grep -q ADVANTLY_BENCH "$out/app-en.log" 2>/dev/null && break; sleep 1; done
          xcrun simctl io "$IOS_SIM" screenshot "$out/live-score-en.png"
          xcrun simctl launch --terminate-running-process --stdout="$out/app-de.log" --stderr="$out/app-de.err.log" "$IOS_SIM" eu.advantly -AppleLanguages "(de)" -AppleLocale de_DE
          sleep 10
          xcrun simctl io "$IOS_SIM" screenshot "$out/live-score-de.png"
          # Validiert n ≥ 40 und numerische Perzentile (sonst Fehler), bewertet G7 (Go/No-Go im Summary)
          python3 .github/scripts/check_s4_bench.py --self-test
          python3 .github/scripts/check_s4_bench.py "$out/app-en.log" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Simulator-Screenshots + Logs hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-s4
          path: build/simulator/
          if-no-files-found: warn
          retention-days: 14
      # Spike S1: Watch-App im Simulator starten; ContentView schreibt per WatchStore.smokeCheck() in die
      # SQLite-Datei und druckt ADVANTLY_SMOKE. Informativ (Simulator-Start kann flaky sein), Ergebnis im Summary.
      - name: watchOS-App-Smoke im Simulator (EventStore)
        continue-on-error: true
        env:
          WATCHOS_SIM: ${{ steps.sim.outputs.watchos }}
        run: |
          app=build/DerivedData/Build/Products/Debug-watchsimulator/AdvantlyWatch.app
          xcrun simctl boot "$WATCHOS_SIM" 2>/dev/null || true
          xcrun simctl bootstatus "$WATCHOS_SIM" -b
          xcrun simctl install "$WATCHOS_SIM" "$app"
          # -advantlySmoke: ContentView schreibt nur mit diesem Startparameter (und nur im Debug-Build) ins Store
          xcrun simctl launch --console-pty --terminate-running-process "$WATCHOS_SIM" eu.advantly.watchkitapp -advantlySmoke > smoke.log 2>&1 &
          pid=$!
          for _ in $(seq 1 45); do grep -q ADVANTLY_SMOKE smoke.log && break; sleep 2; done
          kill "$pid" 2>/dev/null || true
          xcrun simctl terminate "$WATCHOS_SIM" eu.advantly.watchkitapp 2>/dev/null || true
          tail -n 40 smoke.log
          python3 .github/scripts/watch_metrics.py smoke smoke.log
      # W1-E: Info.plist der Watch-App (Workout-Hintergrundmodus, HealthKit-Texte DE/EN) und AppIntents-Metadaten
      - name: Watch-App-Bundle prüfen (W1-E)
        run: |
          app=build/DerivedData/Build/Products/Debug-watchsimulator/AdvantlyWatch.app
          plutil -extract WKBackgroundModes json -o - "$app/Info.plist" | grep -q workout-processing
          plutil -extract WKRunsIndependentlyOfCompanionApp raw -o - "$app/Info.plist" | grep -q true
          plutil -extract NSHealthShareUsageDescription raw -o - "$app/Info.plist"
          plutil -extract NSHealthUpdateUsageDescription raw -o - "$app/Info.plist"
          for lang in en de; do test -f "$app/$lang.lproj/InfoPlist.strings"; done
          if [ -d "$app/Metadata.appintents" ]; then
            echo "AppIntents-Metadaten: $(ls "$app/Metadata.appintents" | tr '\n' ' ')"
          else
            echo "::warning::Keine Metadata.appintents im Watch-Bundle – Action-Taste-Intents nicht registriert?"
          fi
      # W1-E: Watch-App je Etappe neu starten (nur Debug-Build): -advantlyDemoStage <etappe> baut den Zustand direkt
      # (start, scoring, servebar = Aufschlag-Leiste, setend, matchend, display = Anzeige-Modus, ein anderes Gerät zählt)
      # auf (offenes Tennis-Match) und bleibt dort; erst nach dem Marker "ADVANTLY_DEMO stage=<etappe> ready" aus dem
      # Log DIESES Starts wird fotografiert. EN und DE; eine fehlende Etappe (nach einem zweiten Versuch) lässt den Step
      # scheitern. Bilder + Logs im Artefakt watch-simulator-w1e, Marker im Summary.
      - name: watchOS-Demo im Simulator + Screenshots (W1-E)
        timeout-minutes: 20
        env:
          WATCHOS_SIM: ${{ steps.sim.outputs.watchos }}
        run: |
          app=build/DerivedData/Build/Products/Debug-watchsimulator/AdvantlyWatch.app
          out="$PWD/build/watch-w1e"
          mkdir -p "$out"
          xcrun simctl boot "$WATCHOS_SIM" 2>/dev/null || true
          perl -e 'alarm shift; exec @ARGV' 300 xcrun simctl bootstatus "$WATCHOS_SIM" -b
          xcrun simctl install "$WATCHOS_SIM" "$app"
          missing=""
          # $1 Etappe, $2 Sprache, $3 Locale, $4 Versuch; Rückgabe 0, wenn der Screenshot steht
          shoot() {
            log="$out/$1-$2-try$4.log"
            xcrun simctl launch --console-pty --terminate-running-process "$WATCHOS_SIM" eu.advantly.watchkitapp \
              -advantlyDemoStage "$1" -advantlyDemo tennis -AppleLanguages "($2)" -AppleLocale "$3" > "$log" 2>&1 &
            pid=$!
            ok=1
            for _ in $(seq 1 90); do
              if grep -q "ADVANTLY_DEMO stage=$1 ready" "$log"; then ok=0; break; fi
              if grep -q "ADVANTLY_DEMO stage=error" "$log"; then break; fi
              sleep 1
            done
            if [ "$ok" -eq 0 ]; then
              sleep 1
              xcrun simctl io "$WATCHOS_SIM" screenshot "$out/$1-$2.png" || ok=1
            fi
            grep ADVANTLY_ "$log" || true
            kill "$pid" 2>/dev/null || true
            xcrun simctl terminate "$WATCHOS_SIM" eu.advantly.watchkitapp 2>/dev/null || true
            return "$ok"
          }
          for lang in en de; do
            locale=en_US
            if [ "$lang" = de ]; then locale=de_DE; fi
            for stage in start scoring servebar setend matchend display; do
              if ! shoot "$stage" "$lang" "$locale" 1 && ! shoot "$stage" "$lang" "$locale" 2; then
                echo "::error::W1-E-Demo ($lang): Etappe $stage nicht erreicht"
                missing="$missing $stage-$lang"
              fi
            done
          done
          {
            echo "### watchOS-Demo (W1-E)"
            echo
            echo '```'
            grep -h "ADVANTLY_DEMO" "$out"/*.log || echo "keine ADVANTLY_DEMO-Zeilen"
            echo '```'
            for png in "$out"/*.png; do
              if [ -f "$png" ]; then echo "- $(basename "$png")"; fi
            done
            if [ -n "$missing" ]; then echo "Fehlende Etappen:$missing"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          test -z "$missing"
      - name: Watch-Screenshots + Logs hochladen (W1-E)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: watch-simulator-w1e
          path: build/watch-w1e/
          if-no-files-found: warn
          retention-days: 14
      # Spike S1: kaltstart-relevante Größe mit Release-Kotlin. project.yml verweist fest auf debug/ → das
      # Release-XCFramework für diese Messung dorthin kopieren (letzter Build-Schritt, informativ).
      - name: Größe gelinkte Watch-App (Release, Gerät)
        continue-on-error: true
        run: |
          xcf=shared/umbrella-watch/build/XCFrameworks
          rm -rf "$xcf/debug/AdvantlyWatchKit.xcframework"
          cp -R "$xcf/release/AdvantlyWatchKit.xcframework" "$xcf/debug/AdvantlyWatchKit.xcframework"
          xcodebuild build -project iosApp/Advantly.xcodeproj -scheme AdvantlyWatch -configuration Release -destination 'generic/platform=watchOS' -derivedDataPath build/DerivedData ARCHS="arm64_32 arm64" ONLY_ACTIVE_ARCH=NO ENABLE_DEBUG_DYLIB=NO CODE_SIGNING_ALLOWED=NO
          python3 .github/scripts/watch_metrics.py executable "AdvantlyWatch (Release-Kotlin, Gerät)" build/DerivedData/Build/Products/Release-watchos/AdvantlyWatch.app/AdvantlyWatch
      - name: Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-macos
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # P2-Backend (Spike): Migrationen + pgTAP-RLS-Tests gegen den lokalen Supabase-Stack (Docker auf ubuntu).
  # D1 nutzt denselben echten Stack nach den bestehenden K2-Prüfungen.
  supabase-db:
    name: Supabase – Migrationen + pgTAP (ubuntu)
    needs: changes
    if: needs.changes.outputs.supabase == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Deno und Android-SDK aus dem zentralen Katalog lesen
        id: export-tools
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          versions = tomllib.load(open("gradle/libs.versions.toml", "rb"))["versions"]
          print("deno=" + versions["deno"])
          print("sdk=platforms;android-" + versions["android-sdk-platform"])
          PY
      - name: Android-Plattform für D1 installieren
        run: '"${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager" "${{ steps.export-tools.outputs.sdk }}" > /dev/null'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ steps.export-tools.outputs.deno }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: D1-Schranken, XML-Gate und Fehler-Cleanup prüfen
        run: uv run .github/scripts/d1_stack_ci_test.py
      - name: Edge Functions prüfen (Typen, Format, Lint, Tests)
        run: |
          for function in export-my-data cleanup-data-exports; do
            (cd "supabase/functions/$function" && deno task check && deno fmt --check --indent-width 2 && deno lint && deno task test)
          done
      - name: Zufälligen lokalen Cleanup-Schlüssel vorbereiten
        run: uv run .github/scripts/export_stack_ci.py prepare
      # K2 benötigt echte Storage- und Edge-Dienste zusätzlich zu DB/Auth/Realtime.
      - name: Lokalen Stack starten (wendet alle Migrationen an)
        run: supabase start -x imgproxy,mailpit,postgres-meta,studio,logflare,vector,supavisor > "$RUNNER_TEMP/supabase-start.log" 2>&1
      - name: Lokale Schlüssel maskieren und Vault verbinden
        run: uv run .github/scripts/export_stack_ci.py configure
      - name: Edge Functions lokal bedienen
        run: |
          supabase functions serve --env-file supabase/functions/.env > "$RUNNER_TEMP/export-functions.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/export-functions.pid"
          uv run .github/scripts/export_stack_ci.py ready
      - name: pgTAP-Tests (RLS, RPCs)
        # Normal ~4,5 min; ein Hänger soll den Schritt beenden, nicht den 60-min-Job.
        timeout-minutes: 15
        run: supabase test db
      # Review P3-6: 290 erneut mit reltuples 0 (Owner-Rechte, kein Superuser). Direkt nach pgTAP, solange die Tabellen
      # leer sind; normal ~15 s, ein Fehlplan endet nach 5 min im transaction_timeout von 290.
      - name: 290 mit verfälschter Planner-Statistik
        timeout-minutes: 8
        run: >-
          ADVANTLY_LIFECYCLE_TEST_DB_URL="$ADVANTLY_EXPORT_TEST_DB_URL"
          uv run supabase/tests/database/290_staged_account_deletion_zero_stats.py --confirm-disposable
      - name: Consent-Gate und D2/D3-Lockrennen prüfen
        timeout-minutes: 8
        run: |
          ADVANTLY_CONSENT_TEST_DB_URL="$ADVANTLY_EXPORT_TEST_DB_URL" uv run supabase/tests/database/181_cloud_consent_gate_concurrency.py --confirm-disposable
          ADVANTLY_LIFECYCLE_TEST_DB_URL="$ADVANTLY_EXPORT_TEST_DB_URL" uv run supabase/tests/database/210_cloud_lifecycle_redactions_concurrency.py --confirm-disposable
          ADVANTLY_LIFECYCLE_TEST_DB_URL="$ADVANTLY_EXPORT_TEST_DB_URL" uv run supabase/tests/database/220_redaction_write_guards_concurrency.py --confirm-disposable
          ADVANTLY_LIFECYCLE_TEST_DB_URL="$ADVANTLY_EXPORT_TEST_DB_URL" uv run supabase/tests/database/250_late_redaction_manifest_concurrency.py --confirm-disposable
          ADVANTLY_LIFECYCLE_TEST_DB_URL="$ADVANTLY_EXPORT_TEST_DB_URL" uv run supabase/tests/database/290_staged_account_deletion_concurrency.py --confirm-disposable
      - name: Export-Rennen und SQL-ZIP-CSV-Rundlauf
        run: uv run supabase/tests/database/200_private_data_exports_concurrency.py --confirm-disposable --archive-roundtrip
      - name: Export über echte Auth-, HTTP- und Storage-Dienste
        run: uv run supabase/tests/200_private_data_exports_live.py --confirm-disposable
      - name: Vault-Scheduler über pg_net und Edge prüfen
        run: uv run .github/scripts/export_stack_ci.py scheduler
      - name: D1 über echte Auth und PostgREST samt Paging und Reparatur prüfen
        run: uv run .github/scripts/d1_stack_ci.py --confirm-disposable
      # Warnungen sichtbar machen; SQL-/Typfehler lassen den Job scheitern. Auch interne Helfer prüfen.
      - name: Datenbank-Lint (Fehler sind fatal)
        run: supabase db lint --local --schema public,private,ops --level warning --fail-on error
      # K7: Pilotprüfungen über echte Dienste; auth_negative zuletzt, weil es das Ticketbudget bucht.
      - name: K7-Pilotprüfungen über echte Dienste
        timeout-minutes: 15
        run: |
          uv run tools/pilot-checks/test_stack.py
          failed=""
          for c in release_gate support revoke export cloud_upload deletion_job auth_negative; do
            ADVANTLY_PILOT_DB_URL="$ADVANTLY_EXPORT_TEST_DB_URL" uv run "tools/pilot-checks/check_$c.py" || failed="$failed $c"
          done
          if [ -n "$failed" ]; then echo "::error::K7 gescheitert:$failed"; exit 1; fi
      - name: Stack stoppen
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/export-functions.pid" ]; then kill "$(cat "$RUNNER_TEMP/export-functions.pid")" 2>/dev/null || true; fi
          # Aufräumen darf den Job nicht scheitern lassen; der Runner wird ohnehin verworfen.
          supabase stop --no-backup || echo "::warning::supabase stop fehlgeschlagen"
          rm -f supabase/functions/.env
