name: Android-Release (signierte AABs)

# Nur manuell (Actions → "Android-Release (signierte AABs)" → Run workflow). Baut Phone- und Wear-AAB mit dem
# Upload-Key und legt sie als Artefakt ab; hochgeladen wird von Hand in der Play Console.
# Secrets (Environment "android-release") und Einrichtung: docs/release/play-console.md, Abschnitt "CI".
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  bundle:
    name: bundleAllRelease (signiert)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Environment mit Secrets; dort optional "Required reviewers" bzw. Branch-Beschränkung auf main setzen.
    environment: android-release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Upload-Keystore aus Secret entpacken
        env:
          KEYSTORE_BASE64: ${{ secrets.ADVANTLY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ADVANTLY_UPLOAD_KEYSTORE_BASE64 fehlt (docs/release/play-console.md, Abschnitt CI)."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/advantly-upload.jks"
          echo "ADVANTLY_UPLOAD_KEYSTORE=$RUNNER_TEMP/advantly-upload.jks" >> "$GITHUB_ENV"
      # Kein Configuration Cache: die Passwörter sollen nicht in einem Cache-Eintrag landen.
      - name: AABs bauen (Phone + Wear)
        env:
          ADVANTLY_UPLOAD_STORE_PASSWORD: ${{ secrets.ADVANTLY_UPLOAD_STORE_PASSWORD }}
          ADVANTLY_UPLOAD_KEY_ALIAS: ${{ secrets.ADVANTLY_UPLOAD_KEY_ALIAS }}
          ADVANTLY_UPLOAD_KEY_PASSWORD: ${{ secrets.ADVANTLY_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleAllRelease --no-configuration-cache
      - name: Signatur prüfen + Summary
        run: |
          set -euo pipefail
          {
            echo "### Release-AABs"
            echo
            echo "| Datei | Größe | Zertifikat SHA-256 |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for aab in androidApp/build/outputs/bundle/release/androidApp-release.aab wearApp/build/outputs/bundle/release/wearApp-release.aab; do
            jarsigner -verify "$aab" | grep -q "jar verified" || { echo "::error::$aab ist nicht signiert"; exit 1; }
            sha=$(keytool -printcert -jarfile "$aab" | awk '/SHA256:/ {print $2; exit}')
            echo "| \`$aab\` | $(du -h "$aab" | cut -f1) | \`$sha\` |" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: AABs + R8-Mapping hochladen
        uses: actions/upload-artifact@v7
        with:
          name: advantly-release-aabs
          path: |
            androidApp/build/outputs/bundle/release/*.aab
            wearApp/build/outputs/bundle/release/*.aab
            androidApp/build/outputs/mapping/release/mapping.txt
            wearApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 7
      - name: Keystore entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/advantly-upload.jks"
