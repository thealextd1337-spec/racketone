name: Supabase staging deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrationen nach staging (Frankfurt)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
    steps:
      # Secrets sind erst im Environment-Job verfügbar; fehlende Werte sind ein sauberer No-op.
      - name: Konfiguration prüfen
        id: config
        shell: bash
        run: |
          missing=()
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_STAGING_PROJECT_REF; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging-Deploy übersprungen. Im GitHub-Environment staging fehlen: ${missing[*]}"
            echo "Staging-Deploy übersprungen. Fehlende Konfiguration: ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.ready == 'true'
        with:
          version: 2.121.0
      - name: Staging-Projekt verknüpfen
        if: steps.config.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_STAGING_PROJECT_REF"
      - name: Ausstehende Migrationen anzeigen (Dry-run)
        if: steps.config.outputs.ready == 'true'
        run: supabase db push --linked --dry-run --skip-vault
      - name: Migrationen anwenden
        if: steps.config.outputs.ready == 'true'
        run: supabase db push --linked --skip-vault --yes
      # Kein test db --linked: 000-setup-tests-hooks installiert dauerhaft Schema und SECURITY-DEFINER-Helfer.
      # pgTAP und Lint laufen isoliert im lokalen CI-Stack, siehe supabase/README.md.
