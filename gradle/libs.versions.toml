# Einzige Quelle für alle Versionen im Advantly-Monorepo.
# Kotlin, SKIE und Compose Multiplatform nur gemeinsam anheben (SKIE ist an die Kotlin-Version gebunden).
# Geprüft gegen Maven Central / Google Maven / Gradle Plugin Portal am 2026-10-14 (SQLDelight, Wearable: 2026-10-15).

[versions]
# --- App / SDK ---
android-compileSdk = "37"
android-targetSdk = "36"
android-minSdk = "28"
android-minSdk-wear = "34"
java = "21"
jvmTarget = "17"

# --- Build ---
kotlin = "2.4.20"
agp = "9.3.1"
compose-multiplatform = "1.12.1"
compose-material3 = "1.9.0"
skie = "0.10.15"
ktlint-gradle = "14.2.0"
ktlint = "1.8.0"

# --- Bibliotheken ---
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
androidx-activity = "1.13.0"
wear-compose = "1.7.1"
# Wear OS: Health Services (ExerciseClient), Ambient (AmbientLifecycleObserver), Ongoing Activity – Spike S5
health-services-client = "1.1.0"
wear = "1.4.0"
wear-ongoing = "1.1.0"
# androidx.wear:wear zieht fragment 1.2.4; ab 1.3.0 ist registerForActivityResult sicher (Lint InvalidFragmentVersionForActivityResult)
androidx-fragment = "1.9.1"
junit4 = "4.13.2"
kotest = "6.2.6"
# SQLDelight 2.4.1 (06.10.2026): native-driver inkl. sqliter/stately auch für watchosDeviceArm64 (Spike S1, geprüft 2026-10-15)
sqldelight = "2.4.1"
# Wear Data Layer (MessageClient, DataClient, CapabilityClient) – Google Maven, geprüft 2026-10-15
play-services-wearable = "20.0.1"

[libraries]
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
# Nur für Tests/Werkzeuge der Pure-Module (Testvektoren lesen/schreiben) – nie in commonMain
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }

compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wear-compose" }
wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wear-compose" }
health-services-client = { module = "androidx.health:health-services-client", version.ref = "health-services-client" }
wear-ambient = { module = "androidx.wear:wear", version.ref = "wear" }
wear-ongoing = { module = "androidx.wear:wear-ongoing", version.ref = "wear-ongoing" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidx-fragment" }

sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "play-services-wearable" }

kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
junit4 = { module = "junit:junit", version.ref = "junit4" }

# Gradle-Plugins als Bibliotheken für build-logic (compileOnly)
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
compose-gradlePlugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose-multiplatform" }
composeCompiler-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ktlint-gradlePlugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
skie = { id = "co.touchlab.skie", version.ref = "skie" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }

# Convention Plugins aus build-logic/
advantly-kmp-library = { id = "advantly.kmp.library" }
advantly-kmp-base = { id = "advantly.kmp.base" }
advantly-kmp-compose = { id = "advantly.kmp.compose" }
advantly-android-application = { id = "advantly.android.application" }
advantly-android-compose = { id = "advantly.android.compose" }
